services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodledger}
      POSTGRES_DB: ${POSTGRES_DB:-foodledger}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodledger} -d ${POSTGRES_DB:-foodledger}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
